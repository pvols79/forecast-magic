name: forecast-magic

services:
  forecast-magic:
    image: forecast-magic:local
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/app.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      REPORTING_API_TOKEN: ${REPORTING_API_TOKEN:-}
      AUDIT_READ_TOKEN: ${AUDIT_READ_TOKEN:-}
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-}
      AUDIT_PENDING_WARNING_BUSINESS_DAYS: ${AUDIT_PENDING_WARNING_BUSINESS_DAYS:-3}
      AUDIT_PENDING_CRITICAL_BUSINESS_DAYS: ${AUDIT_PENDING_CRITICAL_BUSINESS_DAYS:-5}
      AUDIT_STATEMENT_FRESH_HOURS: ${AUDIT_STATEMENT_FRESH_HOURS:-36}
      LUNCH_MONEY_API_KEY: ${LUNCH_MONEY_API_KEY:-}
    volumes:
      - forecast-magic-data:/data
    networks:
      proxy:
        aliases:
          - forecast-magic

volumes:
  forecast-magic-data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
